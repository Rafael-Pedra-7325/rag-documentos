[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-documentos"
version = "0.1.0"
description = "Assistente que responde perguntas sobre PDFs com busca vetorial, FastAPI e citação da página de origem."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Rafael Fernandes de Souza Pedra" }]
keywords = ["rag", "llm", "genai", "fastapi", "chromadb", "embeddings", "pdf", "nlp"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Framework :: FastAPI",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    "pypdf>=4.0",
    "numpy>=1.26",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
chroma = ["chromadb>=0.5"]
embeddings = ["sentence-transformers>=3.0"]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.40"]
all = ["rag-documentos[chroma,embeddings,anthropic,openai]"]
dev = ["pytest>=8", "httpx>=0.27", "reportlab>=4", "ruff>=0.5"]

[project.scripts]
rag-docs = "rag_documentos.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rag_documentos = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
