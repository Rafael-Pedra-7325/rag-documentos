<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RAG Documentos</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f5f6fa; --panel: #ffffff; --text: #1b2130; --muted: #667085; --line: #e4e7ee;
      --accent: #4f46e5; --accent-ink: #ffffff; --accent-soft: #eceafe;
      --danger: #d92d40; --ok: #12805c; --radius: 14px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0e1117; --panel: #161b25; --text: #e9ecf3; --muted: #9aa3b5; --line: #262d3b;
        --accent: #8b87ff; --accent-ink: #0e1117; --accent-soft: #232145;
        --danger: #ff6b7a; --ok: #4cd6a3;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .app { display: grid; grid-template-columns: 330px 1fr; height: 100%; }
    aside {
      background: var(--panel); border-right: 1px solid var(--line);
      display: flex; flex-direction: column; min-height: 0; padding: 20px; gap: 16px;
    }
    h1 { font-size: 18px; margin: 0; letter-spacing: -0.01em; }
    .tagline { color: var(--muted); font-size: 13px; margin: 2px 0 0; }
    .drop {
      border: 2px dashed var(--line); border-radius: var(--radius); padding: 18px;
      text-align: center; color: var(--muted); cursor: pointer; transition: .15s;
    }
    .drop:hover, .drop.over { border-color: var(--accent); background: var(--accent-soft); color: var(--text); }
    .drop strong { color: var(--text); display: block; margin-bottom: 2px; }
    .drop input { display: none; }
    .status { font-size: 13px; min-height: 18px; color: var(--muted); }
    .status.error { color: var(--danger); }
    .status.ok { color: var(--ok); }
    .section-title {
      font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
      display: flex; justify-content: space-between; align-items: center;
    }
    .docs { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; min-height: 0; }
    .doc {
      display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center;
      border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
    }
    .doc .name { font-weight: 600; font-size: 14px; word-break: break-word; }
    .doc .meta { font-size: 12px; color: var(--muted); }
    .icon-btn {
      border: 0; background: transparent; color: var(--muted); cursor: pointer;
      font-size: 16px; padding: 4px 6px; border-radius: 6px;
    }
    .icon-btn:hover { color: var(--danger); background: var(--accent-soft); }
    .empty-docs { color: var(--muted); font-size: 13px; padding: 8px 2px; }
    .health { font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 12px; }

    main { display: flex; flex-direction: column; min-height: 0; }
    #messages { flex: 1; overflow-y: auto; padding: 28px clamp(16px, 6vw, 80px); display: flex; flex-direction: column; gap: 18px; }
    .hero { margin: auto; max-width: 520px; text-align: center; color: var(--muted); }
    .hero h2 { color: var(--text); margin: 0 0 8px; font-size: 22px; letter-spacing: -0.01em; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 14px; }
    .chip {
      border: 1px solid var(--line); background: var(--panel); color: var(--text);
      padding: 7px 12px; border-radius: 999px; font-size: 13px; cursor: pointer;
    }
    .chip:hover { border-color: var(--accent); }
    .msg { max-width: 820px; width: 100%; margin: 0 auto; }
    .msg.user .bubble { background: var(--accent); color: var(--accent-ink); margin-left: auto; width: fit-content; max-width: 85%; }
    .bubble { padding: 12px 16px; border-radius: var(--radius); white-space: pre-wrap; word-wrap: break-word; }
    .msg.assistant .bubble { background: var(--panel); border: 1px solid var(--line); }
    .cite {
      display: inline-block; background: var(--accent-soft); color: var(--accent);
      font-size: 12px; font-weight: 700; padding: 0 6px; border-radius: 6px; margin: 0 1px;
    }
    .sources { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
    .sources > .label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
    details.src { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
    details.src.cited { border-color: var(--accent); }
    details.src summary { cursor: pointer; padding: 8px 12px; font-size: 13px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    details.src .snippet { padding: 0 12px 12px; font-size: 13px; color: var(--muted); white-space: pre-wrap; }
    .score { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }
    .typing { color: var(--muted); }

    form { padding: 16px clamp(16px, 6vw, 80px) 24px; }
    .composer {
      max-width: 820px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end;
      background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px;
    }
    .composer:focus-within { border-color: var(--accent); }
    textarea {
      flex: 1; resize: none; border: 0; outline: 0; background: transparent; color: inherit;
      font: inherit; max-height: 160px; padding: 6px 8px;
    }
    button.send {
      border: 0; background: var(--accent); color: var(--accent-ink); font-weight: 600;
      padding: 9px 16px; border-radius: 10px; cursor: pointer;
    }
    button.send:disabled { opacity: .5; cursor: not-allowed; }
    .hint { max-width: 820px; margin: 6px auto 0; font-size: 12px; color: var(--muted); }

    @media (max-width: 820px) {
      .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
      aside { border-right: 0; border-bottom: 1px solid var(--line); max-height: 45vh; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside>
      <div>
        <h1>📄 RAG Documentos</h1>
        <p class="tagline">Pergunte aos seus PDFs e veja de onde veio a resposta.</p>
      </div>

      <label class="drop" id="drop">
        <input type="file" id="file" accept="application/pdf,.pdf" multiple />
        <strong>Enviar PDFs</strong>
        Arraste arquivos aqui ou clique para escolher
      </label>
      <div class="status" id="status"></div>

      <div class="section-title"><span>Documentos</span><span id="doc-count"></span></div>
      <div class="docs" id="docs"></div>
      <div class="health" id="health"></div>
    </aside>

    <main>
      <div id="messages"></div>
      <form id="form" autocomplete="off">
        <div class="composer">
          <textarea id="question" rows="1" placeholder="Faça uma pergunta sobre os documentos..." maxlength="2000"></textarea>
          <button class="send" id="send" type="submit">Perguntar</button>
        </div>
        <div class="hint" id="scope-hint">Enter envia · Shift+Enter quebra linha</div>
      </form>
    </main>
  </div>

  <script>
    const $ = (selector) => document.querySelector(selector);
    const state = { docs: [], selected: new Set(), busy: false };

    function el(tag, attrs = {}, ...children) {
      const node = document.createElement(tag);
      for (const [key, value] of Object.entries(attrs)) {
        if (key === "class") node.className = value;
        else if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
        else if (value === true) node.setAttribute(key, "");
        else if (value !== false && value != null) node.setAttribute(key, value);
      }
      for (const child of children.flat()) {
        node.append(child instanceof Node ? child : document.createTextNode(String(child)));
      }
      return node;
    }

    // URL do backend. Vazio = mesmo servidor (uso local).
    const API_BASE = "https://SEU-BACKEND.onrender.com";
    async function api(path, options = {}) {
      const response = await fetch(API_BASE + path, options);
      if (!response.ok) {
        let detail = response.statusText;
        try {
          const body = await response.json();
          detail = typeof body.detail === "string" ? body.detail : JSON.stringify(body.detail);
        } catch (_) { /* keep statusText */ }
        throw new Error(detail);
      }
      return response.status === 204 ? null : response.json();
    }

    function setStatus(message, kind = "") {
      const node = $("#status");
      node.textContent = message;
      node.className = "status " + kind;
    }

    /* ----------------------------------------------------------- documents */
    function renderDocs() {
      const list = $("#docs");
      list.replaceChildren();
      $("#doc-count").textContent = state.docs.length ? String(state.docs.length) : "";
      if (!state.docs.length) {
        list.append(el("div", { class: "empty-docs" }, "Nenhum documento ainda. Envie um PDF para começar."));
      }
      for (const doc of state.docs) {
        const checkbox = el("input", {
          type: "checkbox", checked: state.selected.has(doc.doc_id),
          title: "Restringir as perguntas a este documento",
          onchange: (event) => {
            event.target.checked ? state.selected.add(doc.doc_id) : state.selected.delete(doc.doc_id);
            updateScopeHint();
          },
        });
        const remove = el("button", {
          class: "icon-btn", type: "button", title: "Remover documento",
          onclick: () => removeDoc(doc),
        }, "✕");
        list.append(el("div", { class: "doc" },
          checkbox,
          el("div", {},
            el("div", { class: "name" }, doc.filename),
            el("div", { class: "meta" }, `${doc.pages} pág. · ${doc.chunks} trechos`)),
          remove));
      }
      updateScopeHint();
    }

    function updateScopeHint() {
      const n = state.selected.size;
      $("#scope-hint").textContent = (n
        ? `Buscando em ${n} documento${n > 1 ? "s" : ""} selecionado${n > 1 ? "s" : ""}`
        : "Buscando em todos os documentos") + " · Enter envia · Shift+Enter quebra linha";
    }

    async function refreshDocs() {
      state.docs = await api("/api/documents");
      const ids = new Set(state.docs.map((d) => d.doc_id));
      for (const id of [...state.selected]) if (!ids.has(id)) state.selected.delete(id);
      renderDocs();
    }

    async function uploadFiles(files) {
      for (const file of files) {
        setStatus(`Indexando ${file.name}...`);
        const body = new FormData();
        body.append("file", file);
        try {
          const result = await api("/api/documents", { method: "POST", body });
          const extra = result.warnings.length ? " · " + result.warnings.join(" ") : "";
          setStatus(`✓ ${result.document.filename}: ${result.document.chunks} trechos${extra}`, "ok");
        } catch (error) {
          setStatus(`✗ ${file.name}: ${error.message}`, "error");
        }
      }
      await refreshDocs();
    }

    async function removeDoc(doc) {
      if (!confirm(`Remover "${doc.filename}" do índice?`)) return;
      try {
        await api(`/api/documents/${encodeURIComponent(doc.doc_id)}`, { method: "DELETE" });
        await refreshDocs();
      } catch (error) {
        setStatus(`✗ ${error.message}`, "error");
      }
    }

    /* ----------------------------------------------------------- chat */
    function renderWithCitations(text) {
      const bubble = el("div", { class: "bubble" });
      for (const part of text.split(/(\[\d+(?:\s*[,;]\s*\d+)*\])/)) {
        if (/^\[\d/.test(part)) bubble.append(el("span", { class: "cite" }, part));
        else if (part) bubble.append(document.createTextNode(part));
      }
      return bubble;
    }

    function renderSources(sources) {
      if (!sources.length) return null;
      return el("div", { class: "sources" },
        el("div", { class: "label" }, "Fontes"),
        sources.map((s) => el("details", { class: "src" + (s.cited ? " cited" : "") },
          el("summary", {},
            el("span", { class: "cite" }, `[${s.ref}]`),
            el("span", {}, `${s.filename} · página ${s.page}`),
            el("span", { class: "score" }, s.score.toFixed(3))),
          el("div", { class: "snippet" }, s.text))));
    }

    function addMessage(role, content) {
      const hero = $("#messages .hero");
      if (hero) hero.remove();
      const node = el("div", { class: "msg " + role }, content);
      $("#messages").append(node);
      node.scrollIntoView({ behavior: "smooth", block: "end" });
      return node;
    }

    async function ask(question) {
      if (state.busy || !question.trim()) return;
      state.busy = true;
      $("#send").disabled = true;
      addMessage("user", el("div", { class: "bubble" }, question));
      const pending = addMessage("assistant", el("div", { class: "bubble typing" }, "Buscando nos documentos..."));
      try {
        const result = await api("/api/query", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            question,
            doc_ids: state.selected.size ? [...state.selected] : null,
          }),
        });
        pending.replaceChildren(renderWithCitations(result.answer));
        const sources = renderSources(result.sources);
        if (sources) pending.append(sources);
      } catch (error) {
        pending.replaceChildren(el("div", { class: "bubble", style: "color: var(--danger)" }, `Erro: ${error.message}`));
      } finally {
        state.busy = false;
        $("#send").disabled = false;
        pending.scrollIntoView({ behavior: "smooth", block: "end" });
      }
    }

    function showHero() {
      const examples = ["Quais são os principais pontos do documento?", "Resuma o primeiro capítulo", "O que o texto diz sobre prazos?"];
      $("#messages").append(el("div", { class: "hero" },
        el("h2", {}, "O que você quer saber?"),
        el("p", {}, "Envie um ou mais PDFs na barra lateral e faça perguntas em linguagem natural. Cada resposta mostra o arquivo e a página de onde veio."),
        el("div", { class: "chips" }, examples.map((text) =>
          el("button", { class: "chip", type: "button", onclick: () => { $("#question").value = text; $("#question").focus(); } }, text)))));
    }

    /* ----------------------------------------------------------- wiring */
    $("#form").addEventListener("submit", (event) => {
      event.preventDefault();
      const input = $("#question");
      const question = input.value;
      input.value = "";
      input.style.height = "auto";
      ask(question);
    });
    $("#question").addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        $("#form").requestSubmit();
      }
    });
    $("#question").addEventListener("input", (event) => {
      event.target.style.height = "auto";
      event.target.style.height = Math.min(event.target.scrollHeight, 160) + "px";
    });
    $("#file").addEventListener("change", (event) => {
      uploadFiles([...event.target.files]);
      event.target.value = "";
    });
    const drop = $("#drop");
    ["dragenter", "dragover"].forEach((name) => drop.addEventListener(name, (event) => {
      event.preventDefault(); drop.classList.add("over");
    }));
    ["dragleave", "drop"].forEach((name) => drop.addEventListener(name, (event) => {
      event.preventDefault(); drop.classList.remove("over");
    }));
    drop.addEventListener("drop", (event) => {
      uploadFiles([...event.dataTransfer.files].filter((f) => f.name.toLowerCase().endsWith(".pdf")));
    });

    (async function init() {
      showHero();
      try {
        const health = await api("/api/health");
        $("#health").textContent = `Embeddings: ${health.embedding_model} · LLM: ${health.llm}`;
      } catch (_) { /* the UI still works without the health line */ }
      try { await refreshDocs(); } catch (error) { setStatus(error.message, "error"); }
    })();
  </script>
</body>
</html>
